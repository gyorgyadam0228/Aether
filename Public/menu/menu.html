<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="stylesheet" href="/theme.css">
    <script src="/theme.js"></script>
    <script src="/translations.js"></script>
    <link rel="stylesheet" href="/menu/menu.css">
    <link rel="stylesheet" href="/profileHeader/profileHeader.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="menu.page_title">Menü</title>
</head>
<body>

    <div class="menu">
        <h1 data-i18n="common.app_name">Aether</h1>

        <a href="/game/classSelection.html" class="menu-btn" data-i18n="menu.play_button">Játék</a>
        <a href="/options/options.html" class="menu-btn" data-i18n="menu.options_button">Beállítások</a>
        <a href="/profile/profile.html" class="menu-btn" data-i18n="menu.profile_button">Profil</a>
        <a href="/leaderboard/leaderboard.html" class="menu-btn" data-i18n="menu.leaderboard_button">Ranglista</a>
        <a href="/login/login.html" class="menu-btn" id="logout-link" data-i18n="menu.logout_button">Kijelentkezés</a>
    </div>

    <script src="/shared/avatarTheme.js"></script>
    <script src="/profileHeader/profileHeader.js"></script>
    <script>
        function requireLoginOnFooldal() {
            if (!localStorage.getItem('token')) {
                window.location.replace('/login/login.html')
            }
        }
        document.addEventListener('DOMContentLoaded', requireLoginOnFooldal)
        window.addEventListener('pageshow', function () {
            requireLoginOnFooldal()
        })

        document.getElementById('logout-link')?.addEventListener('click', function (e) {
            e.preventDefault()
            localStorage.removeItem('token')
            localStorage.removeItem('userProfile')
            window.location.replace('/login/login.html')
        })
    </script>
</body>
</html>
