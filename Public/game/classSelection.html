<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="common.app_name">Aether</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="stylesheet" href="/theme.css">
    <script src="/theme.js"></script>
    <script src="/translations.js"></script>
    <link rel="stylesheet" href="/game/game.css">
    <link rel="stylesheet" href="/profileHeader/profileHeader.css">
</head>
<body>
    <a href="/menu/menu.html" class="back-btn" data-i18n="common.back">← Vissza</a>
    <div class="container">
        <div id="character-selection" class="screen">
            <h1 data-i18n="classSelection.title">Válaszd ki a karaktered</h1>
            <p id="class-load-status" class="status-text"></p>
            <div class="character-selector">
                <button id="prev-char-btn" class="arrow-btn" type="button" aria-label="Previous">←</button>

                <div class="selected-character-display">
                    <div id="character-preview"></div>
                    <h2 id="character-name"></h2>
                    <p id="character-description"></p>
                </div>

                <button id="next-char-btn" class="arrow-btn" type="button" aria-label="Next">→</button>
            </div>

            <button id="start-game-btn" class="btn" type="button" data-i18n="classSelection.start_game">Játék indítása</button>
        </div>
    </div>

    <script src="/shared/avatarTheme.js"></script>
    <script src="/profileHeader/profileHeader.js"></script>
    <script src="/game/characterIcon.js"></script>
    <script src="/game/characterSelection.js"></script>
</body>
</html>
